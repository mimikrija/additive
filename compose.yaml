services:
  app:
    image: additive:local
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/additive
      SPRING_DATASOURCE_USERNAME: additive
      SPRING_DATASOURCE_PASSWORD: additive
    ports:
      - "127.0.0.1:${ADDITIVE_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15

  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: additive
      POSTGRES_USER: additive
      POSTGRES_PASSWORD: additive
    ports:
      - "127.0.0.1:${ADDITIVE_DB_PORT:-5432}:5432"
    volumes:
      - additive-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "additive", "-d", "additive"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  additive-data:
