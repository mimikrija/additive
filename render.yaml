services:
  - type: web
    name: additive
    runtime: docker
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:TieredStopAtLevel=1"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "4"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
