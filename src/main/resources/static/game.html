<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play · additive</title>
    <link rel="stylesheet" href="/practice.css">
    <script src="/game.js" defer></script>
</head>
<body class="grid min-h-screen place-items-center bg-sky-50 p-4 text-slate-900">
    <main class="w-full max-w-md rounded-3xl bg-white p-6 shadow-lg sm:p-8">
        <h1 class="text-center text-2xl font-bold text-indigo-800">Play additive</h1>
        <nav class="mt-3 text-center" aria-label="Game modes">
            <a href="/" class="font-semibold text-indigo-800 underline">Go to practice</a>
        </nav>
        <dl class="mt-6 grid grid-cols-3 gap-3 text-center">
            <div><dt>Level</dt><dd id="level" class="text-xl font-bold">–</dd></div>
            <div><dt>Correct streak</dt><dd id="streak" class="text-xl font-bold">–</dd></div>
            <div><dt>Ice creams</dt><dd id="icecreams" class="text-xl font-bold">–</dd></div>
        </dl>
        <p id="problem" aria-live="polite"
           class="my-6 rounded-2xl bg-indigo-50 p-5 text-center text-3xl font-bold tabular-nums sm:text-4xl">
            Ready to play?
        </p>
        <form id="answer-form" class="grid gap-3" hidden>
            <label for="answer" class="font-semibold">Your answer</label>
            <input id="answer" type="number" inputmode="numeric" min="0" max="2147483647" step="1" required
                   class="w-full rounded-xl border border-slate-400 px-4 py-3 text-xl focus-visible:outline-2 focus-visible:outline-indigo-700">
            <button id="check" type="submit"
                    class="rounded-xl bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800 disabled:opacity-50">
                Check answer
            </button>
        </form>
        <p id="feedback" role="status" class="my-3 min-h-6 text-center font-semibold"></p>
        <button id="next" type="button"
                class="w-full rounded-xl border border-indigo-300 px-4 py-3 font-semibold text-indigo-800 hover:bg-indigo-50 disabled:opacity-50">
            Start game
        </button>
    </main>
</body>
</html>
