<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>additive</title>
    <link rel="stylesheet" href="/practice.css">
    <script src="/practice.js" defer></script>
</head>
<body class="grid min-h-screen place-items-center bg-sky-50 p-4 text-slate-900">
    <main class="w-full max-w-md rounded-3xl bg-white p-6 shadow-lg sm:p-8">
        <h1 class="text-center text-2xl font-bold text-indigo-800">additive</h1>
        <div class="mt-6 grid gap-3 sm:grid-cols-2">
            <label for="difficulty" class="grid gap-1 font-semibold">
                Difficulty
                <select id="difficulty" disabled
                        class="w-full rounded-xl border border-slate-400 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-indigo-700 disabled:bg-slate-100"></select>
            </label>
            <label for="operation" class="grid gap-1 font-semibold">
                Operation
                <select id="operation" disabled
                        class="w-full rounded-xl border border-slate-400 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-indigo-700 disabled:bg-slate-100"></select>
            </label>
        </div>
        <p id="problem" aria-live="polite"
           class="my-6 rounded-2xl bg-indigo-50 p-5 text-center text-3xl font-bold tabular-nums sm:text-4xl">
            Loading a problem…
        </p>
        <form id="answer-form" class="grid gap-3">
            <label for="answer" class="font-semibold">Your answer</label>
            <input id="answer" type="number" inputmode="numeric" min="0" step="1" required disabled
                   class="w-full rounded-xl border border-slate-400 px-4 py-3 text-xl focus-visible:outline-2 focus-visible:outline-indigo-700 disabled:bg-slate-100">
            <button id="check" type="submit" disabled
                    class="rounded-xl bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 disabled:opacity-50">
                Check answer
            </button>
        </form>
        <p id="feedback" role="status" class="my-3 min-h-6 text-center font-semibold"></p>
        <button id="next" type="button" disabled
                class="w-full rounded-xl border border-indigo-300 px-4 py-3 font-semibold text-indigo-800 hover:bg-indigo-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 disabled:opacity-50">
            New problem
        </button>
    </main>
</body>
</html>
